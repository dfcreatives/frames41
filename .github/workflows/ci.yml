name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── 1. Lint & Type-Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            admin/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Lint frontend
        run: npm run lint
        working-directory: apps/frontend

      - name: Lint admin
        run: npm run lint
        working-directory: admin

      - name: Type-check frontend
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: apps/frontend

      - name: Type-check admin
        run: npx tsc --noEmit -p tsconfig.json
        working-directory: admin

      - name: Type-check backend
        run: npx tsc --noEmit -p tsconfig.build.json
        working-directory: apps/backend

  # ─── 2. Backend Tests ────────────────────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: frames41_test
          POSTGRES_PASSWORD: frames41_test
          POSTGRES_DB: frames41_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://frames41_test:frames41_test@localhost:5432/frames41_test?schema=public
      NODE_ENV: test
      JWT_ACCESS_SECRET: ci-access-secret-key-at-least-32-characters
      JWT_REFRESH_SECRET: ci-refresh-secret-key-at-least-32-characters
      JWT_ACCESS_EXPIRY: 15m
      JWT_REFRESH_EXPIRY: 30d
      RAZORPAY_KEY_ID: rzp_test_12345678901234
      RAZORPAY_KEY_SECRET: test_key_secret_12345
      RAZORPAY_WEBHOOK_SECRET: ci-razorpay-webhook-secret-key-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: apps/backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Run DB migrations
        run: npx prisma@5.22.0 migrate deploy
        working-directory: apps/backend

      - name: Run unit tests
        run: npm test
        working-directory: apps/backend

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          if-no-files-found: ignore
          retention-days: 14

  # ─── 3. Build Validation ─────────────────────────────────────────────────────
  build:
    name: Build All Workspaces
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: |
            apps/backend/package-lock.json
            apps/frontend/package-lock.json
            admin/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: apps/backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: apps/frontend

      - name: Install admin dependencies
        run: npm ci
        working-directory: admin

      - name: Build backend
        run: npm run build:backend
        working-directory: apps/backend

      - name: Build frontend
        run: npm run build
        working-directory: apps/frontend

      - name: Build admin
        run: npm run build
        working-directory: admin

      - name: Validate frontend bundle size
        run: |
          MAIN_JS=$(find apps/backend/public/assets apps/frontend/dist/assets -name "index-*.js" 2>/dev/null | head -1)
          if [ -n "$MAIN_JS" ]; then
            SIZE=$(wc -c < "$MAIN_JS")
            echo "Main bundle size: ${SIZE} bytes ($(echo "scale=1; $SIZE/1024" | bc) kB)"
            if [ "$SIZE" -gt 512000 ]; then
              echo "FAIL Main bundle too large: ${SIZE} bytes. Budget is 500 kB."
              exit 1
            fi
            echo "PASS Bundle size within budget."
          fi

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.sha }}
          path: apps/backend/public/
          retention-days: 7

      - name: Upload admin build artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist-${{ github.sha }}
          path: admin/dist/
          retention-days: 7

  # ─── 4. Security Audit ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Audit root dependencies
        run: npm audit --audit-level=critical || true

      - name: Audit backend dependencies
        run: npm audit --audit-level=critical || true
        working-directory: apps/backend

      - name: Audit frontend dependencies
        run: npm audit --audit-level=critical || true
        working-directory: apps/frontend
