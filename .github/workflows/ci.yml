name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  # ─── 1. Lint & Type-Check ────────────────────────────────────────────────────
  lint:
    name: Lint & Type-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint -w apps/frontend

      - name: Lint admin
        run: npm run lint -w apps/admin

      - name: Type-check frontend
        run: npx tsc --noEmit -p apps/frontend/tsconfig.json

      - name: Type-check admin
        run: npx tsc --noEmit -p apps/admin/tsconfig.json

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Type-check backend
        run: npx tsc --noEmit -p apps/backend/tsconfig.build.json

  # ─── 2. Build Validation ─────────────────────────────────────────────────────
  build:
    name: Build All Workspaces
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/backend/prisma/schema.prisma

      - name: Build frontend
        run: npm run build -w apps/frontend

      - name: Build backend
        run: npm run build -w apps/backend

      - name: Build admin
        run: npm run build -w apps/admin

      - name: Validate frontend bundle size
        run: |\
          MAIN_JS=$(find apps/backend/public/assets -name "index-*.js" 2>/dev/null | head -1)
          if [ -n "$MAIN_JS" ]; then
            SIZE=$(wc -c < "$MAIN_JS")
            SIZE_KB=$(echo "scale=1; $SIZE/1024" | bc)
            echo "Frontend bundle size: ${SIZE_KB} kB"
            if [ "$SIZE" -gt 512000 ]; then
              echo "FAIL: Bundle too large (limit: 500 kB)"
              exit 1
            fi
            echo "PASS: Bundle within budget"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            apps/backend/public/
            apps/admin/dist/
          retention-days: 7

  # ─── 3. Security Audit ───────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=critical || true

